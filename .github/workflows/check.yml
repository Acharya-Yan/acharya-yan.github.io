name: Check website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chenyu-studio
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: chenyu-studio/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build website
        run: npm run build
