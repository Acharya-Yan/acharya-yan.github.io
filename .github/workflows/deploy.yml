name: Check website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chenyu-studio
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: chenyu-studio/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build website
        run: npm run build
      - name: Upload website
        if: github.event_name != 'pull_request' && vars.PUBLISH_WEBSITE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: chenyu-studio/dist

  deploy:
    # Disabled until the owner explicitly approves publication and enables Pages.
    if: github.event_name != 'pull_request' && vars.PUBLISH_WEBSITE == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
